name: Generate and Publish API Client

on:
  push:
    paths:
      - 'api/test-plan-api.yaml'
    branches:
      - main
  workflow_dispatch:

jobs:
  detect-version-change:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.changed }}
      current_version: ${{ steps.check.outputs.version }}
      previous_version: ${{ steps.check.outputs.previous_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if API version changed
        id: check
        run: |
          # Extract current version from API spec
          CURRENT_VERSION=$(grep "^  version:" api/test-plan-api.yaml | head -1 | awk '{print $2}' | tr -d '"' | tr -d "'")
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          # Check if this is the first commit or if file changed
          if git show HEAD~1:api/test-plan-api.yaml 2>/dev/null; then
            PREVIOUS_VERSION=$(git show HEAD~1:api/test-plan-api.yaml | grep "^  version:" | head -1 | awk '{print $2}' | tr -d '"' | tr -d "'")
            echo "previous_version=$PREVIOUS_VERSION" >> $GITHUB_OUTPUT

            if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
              echo "changed=true" >> $GITHUB_OUTPUT
              echo "✅ Version changed: $PREVIOUS_VERSION → $CURRENT_VERSION"
            else
              echo "changed=false" >> $GITHUB_OUTPUT
              echo "ℹ️  Version unchanged: $CURRENT_VERSION"
            fi
          else
            # First commit with API spec
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "previous_version=none" >> $GITHUB_OUTPUT
            echo "✅ Initial API version: $CURRENT_VERSION"
          fi

  generate-and-publish-java-client:
    needs: detect-version-change
    if: needs.detect-version-change.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install OpenAPI Generator
        run: |
          npm install -g @openapitools/openapi-generator-cli

      - name: Generate Java Client
        env:
          API_VERSION: ${{ needs.detect-version-change.outputs.current_version }}
        run: |
          echo "📦 Generating Java client for API version: $API_VERSION"

          # Update version in config
          sed -i "s/\"dynamic\"/\"$API_VERSION\"/g" client-generator/config-java.json

          # Generate client
          openapi-generator-cli generate \
            -i api/test-plan-api.yaml \
            -g java \
            -o generated-clients/java \
            -c client-generator/config-java.json \
            --additional-properties=licenseName=Apache-2.0

          echo "✅ Java client generated successfully"

      - name: Patch build.gradle
        working-directory: generated-clients/java
        run: |
          # Add Hibernate Validator dependency
          sed -i '/bean_validation_version = /a\    hibernate_validator_version = "8.0.1.Final"' build.gradle
          sed -i '/jakarta.validation:jakarta.validation-api/a\    implementation "org.hibernate.validator:hibernate-validator:$hibernate_validator_version"' build.gradle
          echo "✅ build.gradle patched with Hibernate Validator"

      - name: Build Java Client
        working-directory: generated-clients/java
        run: |
          # Make gradlew executable
          chmod +x gradlew

          # Build the client library
          ./gradlew clean build -x test
          echo "✅ Java client built successfully"

      - name: Configure GitHub Packages Publishing
        working-directory: generated-clients/java
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          # Add maven-publish plugin and publishing configuration to build.gradle
          cat >> build.gradle << 'EOF'

          publishing {
              repositories {
                  maven {
                      name = "GitHubPackages"
                      url = uri("https://maven.pkg.github.com/${{ github.repository }}")
                      credentials {
                          username = System.getenv("GITHUB_ACTOR")
                          password = System.getenv("GITHUB_TOKEN")
                      }
                  }
              }
          }
          EOF

      - name: Publish to GitHub Packages
        working-directory: generated-clients/java
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          ./gradlew publish
          echo "✅ Published to GitHub Packages: com.xq.testplan:testplan-api-client:${{ needs.detect-version-change.outputs.current_version }}"

  skip-publish:
    needs: detect-version-change
    if: needs.detect-version-change.outputs.version_changed == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Skip publishing
        run: |
          echo "ℹ️  Skipping client generation - API version unchanged"
          echo "Current version: ${{ needs.detect-version-change.outputs.current_version }}"
